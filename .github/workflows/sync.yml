name: Sync YouTube Music Tracks

on:
  workflow_dispatch:

jobs:
  sync-music:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ytmusicapi

      - name: Generate temporary cookies.txt from Secret
        env:
          MY_COOKIES: ${{ secrets.YT_M_COOKIES }}
        run: |
          echo "$MY_COOKIES" > cookies.txt

      - name: Convert cookies.txt to browser.json
        run: |
          python -c '
          import json
          cookies = {}
          try:
              with open("cookies.txt", "r") as f:
                  for line in f:
                      if line.startswith("#") or not line.strip():
                          continue
                      parts = line.strip().split("\t")
                      if len(parts) >= 7:
                        cookies[parts[5]] = parts[6]
              
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  "Accept": "*/*",
                  "Accept-Language": "en-US,en;q=0.9",
                  "Content-Type": "application/json",
                  "X-Goog-AuthUser": "0",
                  "Cookie": "; ".join([f"{k}={v}" for k, v in cookies.items()])
              }
              with open("browser.json", "w") as out:
                  json.dump(headers, out, indent=2)
              print("Successfully converted cookies to browser.json securely!")
          except Exception as e:
              print(f"Error converting cookies: {e}")
          '

      - name: Run YouTube Music sync script
        env:
          PLAYLIST_ID: ${{ secrets.PLAYLIST_ID }}
        run: |
          python sync_music.py
