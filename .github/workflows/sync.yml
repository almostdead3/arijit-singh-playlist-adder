name: Sync Arijit Singh Art Tracks

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ytmusicapi playwright
          playwright install chromium

      - name: Run Sync Script
        env:
          PLAYLIST_ID: ${{ secrets.PLAYLIST_ID }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          python sync_art_tracks.py

      - name: Commit and Push State File
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
                    
          touch added_tracks.json
          git add added_tracks.json
                    
          if git diff --staged --quiet; then
            echo "No new tracks added. Skipping commit."
          else
            git commit -m "Update added_tracks.json [skip ci]"
            git push
          fi
