name: Sync Arijit Singh Art Tracks

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Execute Sync Script
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          PLAYLIST_ID: ${{ secrets.PLAYLIST_ID }}
        run: python sync_art_tracks.py

      - name: Save Execution Progress
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add added_tracks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update added_tracks.json progress" && git push)
